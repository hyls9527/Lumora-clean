[package]
name = "Lumora"
version = "0.13.3"
description = "Lumora 鈥?AI-powered image gallery by hyls9527"
authors = ["you"]
license = "MIT"
repository = "https://github.com/hyls9527/Lumora-clean"
edition = "2021"
# 1.81, not 1.77.2: the crash-telemetry panic hook uses
# `std::panic::PanicHookInfo`, renamed from `PanicInfo` in 1.81. CI pins
# `stable`, so this only documents the real floor.
rust-version = "1.81"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.35", features = ["bundled", "backup"] }
sqlite-vec = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "avif", "bmp", "gif", "tiff"] }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
local-ip-address = "0.6"
rand = "0.9"
rmcp = { version = "2.2.0", features = ["server", "schemars", "transport-streamable-http-server"] }

[target.'cfg(unix)'.dependencies]
# Needed to run each sidecar in its own process group and kill the whole group:
# a Unix sidecar is `sh -c "python ..."`, so killing only the direct child
# leaves the real worker alive holding the pipe (see src/sidecar.rs).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# No profile was configured before, so release builds used the defaults: no
# cross-crate inlining and full symbol tables. The Linux release binary landed
# at 38.3 MB against a 30 MB budget — this is the standard size/startup tuning,
# not a budget change.
[profile.release]
lto = true            # cross-crate inlining; biggest single win for size
codegen-units = 1     # required for LTO to see everything
strip = true          # drop symbols the app never ships a debugger for
opt-level = "s"       # size-leaning optimisation
