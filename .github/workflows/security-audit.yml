name: Security Audit

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9:00 UTC
  push:
    branches: [main]
    paths:
      - 'package-lock.json'
      - 'src-tauri/Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm audit --omit=dev

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustsec/audit-check failed with "Unexpected end of JSON input" (its
      # octokit-based advisory fetch); cargo-audit clones the advisory-db via
      # plain git, which is robust.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --file src-tauri/Cargo.lock

  perf-budget:
    name: Performance Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-audit-
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config
      - name: Build release binary (perf-budget measures it)
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
      - run: node scripts/perf-budget.mjs
