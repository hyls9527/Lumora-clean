name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  RUST_VERSION: 'stable'

jobs:
  frontend:
    name: Frontend (TypeScript + Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Performance budget
        run: node scripts/perf-budget.mjs

      - name: Coverage
        run: npx vitest run --coverage

  python-sidecar:
    name: Python (Sidecar unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: python -m pip install pytest

      - name: Sidecar tests
        run: python -m pytest src-tauri/sidecar -q

  rust:
    name: Rust (Tests + Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: actions/cache@v6
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: Tests
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: '1'
        run: |
          set -o pipefail
          cargo test --lib 2>&1 | tee /tmp/rust-tests.log

      - name: Report Rust test failure
        if: failure()
        run: |
          MSG=$(grep -aE 'error(\[|:)|could not compile|failed to (run|build)|panicked|FAILED|failures:|test result|error:' /tmp/rust-tests.log | tail -c 30000)
          MSG=${MSG//%/%25}
          MSG=${MSG//$'\r'/}
          MSG=${MSG//$'\n'/%0A}
          echo "::error title=Rust failure (filtered)::$MSG"
          TAIL=$(tail -c 30000 /tmp/rust-tests.log)
          TAIL=${TAIL//%/%25}
          TAIL=${TAIL//$'\r'/}
          TAIL=${TAIL//$'\n'/%0A}
          echo "::error title=Rust failure (log tail)::$TAIL"

      - name: Check
        working-directory: src-tauri
        run: cargo check

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview

      - name: Install llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage
        working-directory: src-tauri
        run: cargo llvm-cov --lib --fail-under-lines 77 --fail-under-functions 70 --fail-under-regions 77
